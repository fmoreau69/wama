{% comment %}
Barre d'import batch AUDIO (spécifique enhancer, ids consommés par audio-enhancer.js).
Injectée dans la card d'entrée commune via extra_zone_template (port 2026-07-26).
{% endcomment %}
<div id="audioBatchDetectBar" style="display:none; background:#1a1520; border:1px solid #198754; border-radius:0.375rem; padding:0.5rem 0.75rem; margin-bottom:0.5rem;">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-1">
        <span class="small text-light">
            <i class="fas fa-list" style="color:#6ee7b7;"></i>
            <strong>Batch audio</strong> — <span id="audioBatchDetectedCount">0</span> URL(s)
        </span>
        <div class="d-flex gap-1">
            <button class="btn btn-sm py-0 px-2" style="background:#198754;color:#fff;font-size:.8rem;" id="audioBatchPreviewBtn">
                <i class="fas fa-eye"></i> Voir
            </button>
            <button class="btn btn-sm btn-outline-danger py-0 px-1" id="audioBatchCancelBar" title="Annuler">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
    <div id="audioBatchDetectPreview" style="display:none;">
        <div id="audioBatchDetectWarnings" class="alert alert-warning py-1 small mb-1" style="display:none;"></div>
        <div class="table-responsive" style="max-height:140px; overflow-y:auto;">
            <table class="table table-sm table-dark mb-0" style="font-size:0.78rem;">
                <thead style="position:sticky; top:0; background:#1a1520;">
                    <tr><th>URL / Chemin</th></tr>
                </thead>
                <tbody id="audioBatchDetectTable"></tbody>
            </table>
        </div>
        <div class="d-flex gap-2 mt-2">
            <button class="btn btn-success btn-sm flex-grow-1" id="audioBatchCreateAndStartBtn">
                <i class="fas fa-play"></i> Démarrer (<span id="audioBatchCreateCount">0</span>)
            </button>
            <button class="btn btn-outline-primary btn-sm" id="audioBatchCreateOnlyBtn">
                <i class="fas fa-plus"></i> Ajouter
            </button>
        </div>
        <div id="audioBatchCreateProgress" class="mt-2" style="display:none;">
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width:100%;color:#fff;">Création…</div>
            </div>
        </div>
    </div>
</div>
